name: Build FASAL Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK Location
        working-directory: ./android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace > ../build_debug.log 2>&1 || echo "Build exited with code $?" >> ../build_debug.log

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build_debug.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fasal-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
